<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchs MLB - US TV Channels</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 12px;
            overflow-x: hidden;
            width: 100vw;
        }

        /* BANNIÈRE INDICATRICE */
        .date-badge {
            text-align: center;
            padding: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 6px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* CONTAINER DU TABLEAU RESPONSIVE */
        .table-responsive {
            width: 100%;
            max-width: 100%;
            border-radius: 10px;
            border: 2px solid #334155;
            background-color: #1e293b;
            overflow: hidden;
        }

        /* COULEURS DES ÉTATS */
        .table-responsive.is-today {
            border-color: #f59e0b;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
        }

        .table-responsive.is-today .date-badge {
            background-color: #f59e0b;
            color: #000;
        }

        .table-responsive.is-past {
            opacity: 0.55;
            filter: grayscale(0.8);
            border-color: #1e293b;
        }

        .table-responsive.is-past .date-badge {
            background-color: #334155;
            color: #94a3b8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            background-color: #111827;
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 10px 6px;
            text-align: left;
        }

        td {
            padding: 10px 6px;
            border-bottom: 1px solid #334155;
            font-size: 0.85rem;
            word-wrap: break-word;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .badge-live { background-color: #ef4444; color: #fff; }
        .badge-final { background-color: #475569; color: #fff; }
        .badge-sched { background-color: #2563eb; color: #fff; }

        .channel-tag {
            display: inline-block;
            background-color: #1e3a8a;
            color: #93c5fd;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            margin: 1px;
            border: 1px solid #3b82f6;
        }

        .col-time { width: 18%; }
        .col-match { width: 44%; }
        .col-status { width: 18%; }
        .col-tv { width: 20%; }
    </style>
</head>
<body>

<div class="table-responsive" id="tableContainer">
    <div class="date-badge" id="dateBadge">Chargement...</div>
    <table>
        <thead>
            <tr>
                <th class="col-time">Heure</th>
                <th class="col-match">Match</th>
                <th class="col-status">Statut</th>
                <th class="col-tv">TV</th>
            </tr>
        </thead>
        <tbody id="gamesTableBody">
            <tr>
                <td colspan="4" style="text-align: center; padding: 20px;">Connexion à l'API MLB...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const todayStr = new Date().toISOString().split('T')[0];
    const ALLOWED_CHANNELS = ['MLBN', 'MLB NETWORK', 'FS1', 'FOX', 'FOX SPORTS', 'MLB.TV'];

    async function fetchWithFallback(targetUrl) {
        // Liste de endpoints pour garantit l'accès aux données sans blocage CORS
        const proxies = [
            `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
            `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
            targetUrl
        ];

        for (const url of proxies) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    return await res.json();
                }
            } catch (e) {
                console.warn(`Échec de connexion via : ${url}`);
            }
        }
        throw new Error("Toutes les tentatives de réseau ont échoué.");
    }

    async function loadGamesForDate(targetDate) {
        const container = document.getElementById('tableContainer');
        const badge = document.getElementById('dateBadge');
        const tbody = document.getElementById('gamesTableBody');

        container.classList.remove('is-today', 'is-past');

        if (targetDate === todayStr) {
            container.classList.add('is-today');
            badge.textContent = "📅 Matchs du Jour (FOX / FS1 / MLBN / MLB.TV)";
        } else if (targetDate < todayStr) {
            container.classList.add('is-past');
            badge.textContent = "📜 Matchs Passés (FOX / FS1 / MLBN / MLB.TV)";
        } else {
            badge.textContent = "🔮 Matchs À Venir (FOX / FS1 / MLBN / MLB.TV)";
        }

        const mlbApiUrl = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=${targetDate}&endDate=${targetDate}&hydrate=broadcasts(all)`;

        try {
            const data = await fetchWithFallback(mlbApiUrl);
            tbody.innerHTML = '';

            if (!data.dates || data.dates.length === 0 || !data.dates[0].games) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Aucun match au programme aujourd\'hui.</td></tr>';
                return;
            }

            let filteredGamesCount = 0;

            data.dates[0].games.forEach(game => {
                let gameChannels = [];
                if (game.broadcasts && game.broadcasts.length > 0) {
                    gameChannels = game.broadcasts.map(b => (b.callSign || b.name || '').toUpperCase());
                }

                const matchedChannels = gameChannels.filter(ch => 
                    ALLOWED_CHANNELS.some(allowed => ch.includes(allowed))
                );

                if (matchedChannels.length === 0) return;

                filteredGamesCount++;

                const frenchTime = new Date(game.gameDate).toLocaleTimeString('fr-FR', {
                    hour: '2digit',
                    minute: '2digit',
                    timeZone: 'Europe/Paris'
                });

                let statusBadge = '<span class="badge badge-sched">Prévu</span>';
                if (game.status.abstractGameState === 'Live') {
                    statusBadge = '<span class="badge badge-live">Direct</span>';
                } else if (game.status.abstractGameState === 'Final') {
                    statusBadge = '<span class="badge badge-final">Fini</span>';
                }

                const uniqueMatched = [...new Set(matchedChannels)];
                const tvList = uniqueMatched.slice(0, 2).map(c => `<span class="channel-tag">${c}</span>`).join('');

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="col-time"><strong>${frenchTime}</strong></td>
                    <td class="col-match">${game.teams.away.team.name}<br><small style="color:#94a3b8;">@</small> ${game.teams.home.team.name}</td>
                    <td class="col-status">${statusBadge}</td>
                    <td class="col-tv">${tvList}</td>
                `;
                tbody.appendChild(row);
            });

            if (filteredGamesCount === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Aucun match sur FOX, FS1 ou MLBN aujourd\'hui.</td></tr>';
            }

        } catch (err) {
            console.error(err);
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: #f87171;">Impossible de contacter l\'API MLB. Réessayez dans un instant.</td></tr>';
        }
    }

    loadGamesForDate(todayStr);
</script>

</body>
</html>
