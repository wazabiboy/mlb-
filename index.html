<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchs MLB - Données Brutes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 12px;
            overflow-x: hidden;
            width: 100vw;
        }

        .date-badge {
            text-align: center;
            padding: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 6px;
            margin-bottom: 12px;
            text-transform: uppercase;
            background-color: #f59e0b;
            color: #000;
        }

        .table-responsive {
            width: 100%;
            max-width: 100%;
            border-radius: 10px;
            border: 2px solid #f59e0b;
            background-color: #1e293b;
            overflow: hidden;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            background-color: #111827;
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 10px 6px;
            text-align: left;
        }

        td {
            padding: 10px 6px;
            border-bottom: 1px solid #334155;
            font-size: 0.85rem;
            word-wrap: break-word;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .badge-live { background-color: #ef4444; color: #fff; }
        .badge-final { background-color: #475569; color: #fff; }
        .badge-sched { background-color: #2563eb; color: #fff; }

        .channel-tag {
            display: inline-block;
            background-color: #1e3a8a;
            color: #93c5fd;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            margin: 1px;
            border: 1px solid #3b82f6;
        }

        .col-time { width: 18%; }
        .col-match { width: 44%; }
        .col-status { width: 18%; }
        .col-tv { width: 20%; }
    </style>
</head>
<body>

<div class="table-responsive">
    <div class="date-badge">📅 Programme MLB (Semaine en cours - Heure Fr)</div>
    <table>
        <thead>
            <tr>
                <th class="col-time">Heure</th>
                <th class="col-match">Match</th>
                <th class="col-status">Statut</th>
                <th class="col-tv">TV</th>
            </tr>
        </thead>
        <tbody id="gamesTableBody">
            <!-- Rempli par le script ci-dessous sans aucune requête API -->
        </tbody>
    </table>
</div>

<script>
    // DONNÉES BRUTES
    const GAMES_DATA = [
        { date: "10/08", time: "23:45", away: "Phillies", home: "Cardinals", status: "sched", tv: ["FS1", "MLB.TV"] },
        { date: "11/08", time: "01:05", away: "Red Sox", home: "Blue Jays", status: "sched", tv: ["MLBN", "MLB.TV"] },
        { date: "11/08", time: "03:40", away: "Brewers", home: "Padres", status: "sched", tv: ["MLB.TV"] },
        { date: "12/08", time: "01:05", away: "Mariners", home: "Yankees", status: "sched", tv: ["FS1", "MLB.TV"] },
        { date: "12/08", time: "03:45", away: "Astros", home: "Giants", status: "sched", tv: ["MLBN", "MLB.TV"] },
        { date: "13/08", time: "01:05", away: "Mariners", home: "Yankees", status: "sched", tv: ["FS1", "MLB.TV"] },
        { date: "13/08", time: "19:40", away: "Orioles", home: "Twins", status: "sched", tv: ["MLBN", "MLB.TV"] },
        { date: "14/08", time: "01:30", away: "Phillies", home: "Twins", status: "sched", tv: ["FOX", "MLB.TV"] },
        { date: "15/08", time: "21:00", away: "Cardinals", home: "Cubs", status: "sched", tv: ["FS1", "MLB.TV"] },
        { date: "16/08", time: "01:00", away: "Brewers", home: "Dodgers", status: "sched", tv: ["FOX", "MLB.TV"] }
    ];

    const tbody = document.getElementById('gamesTableBody');

    GAMES_DATA.forEach(game => {
        let statusHtml = '<span class="badge badge-sched">Prévu</span>';
        if (game.status === 'live') statusHtml = '<span class="badge badge-live">Direct</span>';
        if (game.status === 'final') statusHtml = '<span class="badge badge-final">Fini</span>';

        const tvTags = game.tv.map(c => `<span class="channel-tag">${c}</span>`).join('');

        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="col-time"><strong>${game.date}</strong><br><small style="color:#94a3b8;">${game.time}</small></td>
            <td class="col-match">${game.away}<br><small style="color:#94a3b8;">@</small> ${game.home}</td>
            <td class="col-status">${statusHtml}</td>
            <td class="col-tv">${tvTags}</td>
        `;
        tbody.appendChild(row);
    });
</script>

</body>
</html>
