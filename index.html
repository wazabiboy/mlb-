<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLB Mobile Schedule</title>
    <style>
        /* BASE MOBILE-FIRST */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --today-gold: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            font-size: 16px; /* Évite le zoom auto sur iPhone */
        }

        .container { max-width: 100%; margin: 0 auto; }

        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 1.4rem; margin: 10px 0; }

        /* CONTROLS (Empilés sur mobile) */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .control-group { display: flex; flex-direction: column; gap: 5px; }
        
        input, select, button {
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: white;
            width: 100%;
            box-sizing: border-box;
        }

        button { background: var(--accent); border: none; font-weight: bold; cursor: pointer; }

        /* TABLE RESPONSIVE */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { background: #111827; padding: 12px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

        /* ÉTATS (Aujourd'hui / Passé) */
        .is-past { opacity: 0.6; filter: grayscale(0.8); }
        .is-today { border: 2px solid var(--today-gold); }
        
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .channel-tag { background: #334155; padding: 2px 5px; border-radius: 4px; font-size: 0.75rem; margin-right: 3px; }

        /* MEDIA QUERY : Desktop (au-dessus de 768px) */
        @media (min-width: 768px) {
            .controls { flex-direction: row; align-items: flex-end; }
            .control-group { flex: 1; }
            button { width: auto; }
            table { min-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <header><h1>⚾ Baseball Direct</h1></header>

    <div class="controls">
        <div class="control-group">
            <label>Date :</label>
            <input type="date" id="datePicker">
        </div>
        <div class="control-group">
            <label>Ligue :</label>
            <select id="leagueSelect">
                <option value="1">MLB</option>
                <option value="11">MiLB (Triple-A)</option>
                <option value="12">MiLB (Double-A)</option>
            </select>
        </div>
        <button id="searchBtn">Charger</button>
    </div>

    <div class="table-wrapper" id="tableContainer">
        <table>
            <thead>
                <tr>
                    <th>Heure</th>
                    <th>Match</th>
                    <th>Statut</th>
                    <th>TV</th>
                </tr>
            </thead>
            <tbody id="gamesTableBody">
                <tr><td colspan="4" style="text-align:center; padding:20px;">Sélectionnez une date.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const dateInput = document.getElementById('datePicker');
    const tableContainer = document.getElementById('tableContainer');
    const todayStr = new Date().toISOString().split('T')[0];
    dateInput.value = todayStr;

    document.getElementById('searchBtn').addEventListener('click', fetchGames);

    async function fetchGames() {
        const date = dateInput.value;
        const league = document.getElementById('leagueSelect').value;
        const tbody = document.getElementById('gamesTableBody');
        
        tableContainer.className = 'table-wrapper';
        if (date === todayStr) tableContainer.classList.add('is-today');
        else if (date < todayStr) tableContainer.classList.add('is-past');

        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Chargement...</td></tr>';

        try {
            const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=${league}&startDate=${date}&endDate=${date}&hydrate=broadcasts(all)`);
            const data = await res.json();
            tbody.innerHTML = '';

            if (!data.dates?.[0]?.games) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Aucun match.</td></tr>';
                return;
            }

            data.dates[0].games.forEach(g => {
                const time = new Date(g.gameDate).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit', timeZone:'Europe/Paris'});
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${time}</strong></td>
                    <td>${g.teams.away.team.name.slice(0,10)}<br>vs<br>${g.teams.home.team.name.slice(0,10)}</td>
                    <td>${g.status.abstractGameState === 'Live' ? '<span style="color:red">● En direct</span>' : g.status.abstractGameState}</td>
                    <td>${g.broadcasts?.slice(0,2).map(b=>`<span class="channel-tag">${b.callSign}</span>`).join('') || '-'}</td>
                `;
                tbody.appendChild(row);
            });
        } catch(e) { tbody.innerHTML = '<tr><td colspan="4">Erreur.</td></tr>'; }
    }
</script>
</body>
      </html>
